<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Reveal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #333; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .instructions {
            background: #fff9e6;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            border-left: 4px solid #ffc107;
            font-size: 14px;
        }
        .name-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin: 30px 0;
        }
        .name-btn {
            padding: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .name-btn:hover {
            background: #5568d3;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .name-btn:active { transform: translateY(0); }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 10;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: white;
            border-radius: 12px;
            padding: 35px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: popIn 0.2s ease;
        }
        .modal-emoji { font-size: 40px; margin-bottom: 15px; }
        .modal-title { margin: 0 0 10px; color: #333; font-size: 20px; }
        .modal-text { color: #666; font-size: 15px; margin: 0 0 25px; }
        .modal-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .modal-btn-primary { background: #667eea; color: white; }
        .modal-btn-primary:hover { background: #5568d3; }
        .modal-btn-secondary { background: #f0f0f0; color: #555; }
        .modal-btn-secondary:hover { background: #e0e0e0; }
        .modal-btn-close { background: #764ba2; color: white; }
        .modal-btn-close:hover { background: #5f3a82; }
        .result-name {
            font-size: 40px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0 25px;
            animation: popIn 0.3s ease;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to   { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Click Your Name</h1>
        <p class="subtitle">Find out who your target is</p>
        <div class="instructions">
            <strong>Instructions:</strong> Tap your name. Confirm it's really you, then your target will appear. Keep it secret!
        </div>
        <div class="name-buttons">
            <button class="name-btn" onclick="startReveal('Sam')">Sam</button>
            <button class="name-btn" onclick="startReveal('Henrieett')">Henrieett</button>
            <button class="name-btn" onclick="startReveal('Jonathan')">Jonathan</button>
            <button class="name-btn" onclick="startReveal('Kate')">Kate</button>
            <button class="name-btn" onclick="startReveal('Nathan')">Nathan</button>
            <button class="name-btn" onclick="startReveal('Rochelle')">Rochelle</button>
            <button class="name-btn" onclick="startReveal('Genevieve')">Genevieve</button>
            <button class="name-btn" onclick="startReveal('Emily')">Emily</button>
            <button class="name-btn" onclick="startReveal('Leady')">Leady</button>
            <button class="name-btn" onclick="startReveal('Grace')">Grace</button>
            <button class="name-btn" onclick="startReveal('Daniela')">Daniela</button>
            <button class="name-btn" onclick="startReveal('Carol')">Carol</button>
            <button class="name-btn" onclick="startReveal('Natasha')">Natasha</button>
            <button class="name-btn" onclick="startReveal('Pete')">Pete</button>
            <button class="name-btn" onclick="startReveal('David')">David</button>
            <button class="name-btn" onclick="startReveal('Sarah')">Sarah</button>
            <button class="name-btn" onclick="startReveal('James')">James</button>
        </div>
        <p style="text-align:center; color:#999; font-size:13px;">Tap your name to get started</p>
    </div>

    <!-- Confirm modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-emoji">👀</div>
            <h2 class="modal-title" id="confirmTitle"></h2>
            <p class="modal-text" id="confirmText"></p>
            <button class="modal-btn modal-btn-primary" onclick="doReveal()">Reveal my target</button>
            <button class="modal-btn modal-btn-secondary" onclick="closeConfirm()">Cancel</button>
        </div>
    </div>

    <!-- Result modal -->
    <div id="resultModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-emoji">🎯</div>
            <p class="modal-text" id="resultLabel"></p>
            <div class="result-name" id="resultName"></div>
            <button class="modal-btn modal-btn-close" onclick="closeResult()">Got it — close</button>
        </div>
    </div>

    <script>
        const cycle = {
            "Daniela": "Emily",
            "Emily": "Carol",
            "Carol": "David",
            "David": "Kate",
            "Kate": "Grace",
            "Grace": "Henrieett",
            "Henrieett": "Leady",
            "Leady": "Genevieve",
            "Genevieve": "James",
            "James": "Jonathan",
            "Jonathan": "Rochelle",
            "Rochelle": "Sam",
            "Sam": "Sarah",
            "Sarah": "Pete",
            "Pete": "Natasha",
            "Natasha": "Nathan",
            "Nathan": "Daniela",
        };

        let pendingName = null;

        function startReveal(name) {
            pendingName = name;
            document.getElementById('confirmTitle').textContent = `Confirm reveal for ${name}`;
            document.getElementById('confirmText').textContent = `Only ${name} should be looking at the screen right now!`;
            document.getElementById('confirmModal').classList.add('open');
        }

        function closeConfirm() {
            pendingName = null;
            document.getElementById('confirmModal').classList.remove('open');
        }

        function doReveal() {
            document.getElementById('confirmModal').classList.remove('open');
            document.getElementById('resultLabel').textContent = `${pendingName}'s target is:`;
            document.getElementById('resultName').textContent = cycle[pendingName];
            document.getElementById('resultModal').classList.add('open');
        }

        function closeResult() {
            pendingName = null;
            document.getElementById('resultModal').classList.remove('open');
        }
    </script>
</body>
</html>
